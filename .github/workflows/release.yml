name: Build & Release APK

# Trigger: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app   # the Expo project lives in app/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      # app.config.js reads ../.env (project root). The real .env is not in the repo,
      # so it is created here from GitHub Secrets.
      - name: Create .env for the build
        working-directory: .
        run: |
          {
            echo "SERVER_HOST=${{ secrets.SERVER_HOST }}"
            echo "SERVER_PORT=${{ secrets.SERVER_PORT }}"
            echo "APP_TOKEN=${{ secrets.APP_TOKEN }}"
            echo "GITHUB_REPO=${{ github.repository }}"
            echo "APP_VERSION=${GITHUB_REF_NAME#v}"
          } > .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: app/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK
        working-directory: .
        run: cp app/android/app/build/outputs/apk/release/app-release.apk "FaceNet-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FaceNet-${{ github.ref_name }}.apk
          generate_release_notes: true
